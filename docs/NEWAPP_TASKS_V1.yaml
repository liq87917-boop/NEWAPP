    acceptance: ['One failed image does not fail whole batch.', 'Retry only failed items.']
  - id: NEWAPP-042
    phase: P6
    title: Batch review and bulk draft generation
    depends_on: [NEWAPP-041]
    actions: ['Implement S16 normal/exception filters.', 'Allow batch default currency/unit.', 'Bulk upsert drafts idempotently.']
    acceptance: ['Normal high-confidence items can be accepted in bulk.', 'Exceptions remain explicit.']

