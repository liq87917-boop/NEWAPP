project:
  name: NEWAPP
  root: 'D:\VSCodeProject\NEWAPP'
  brain: GPT
  executor_policy: >-
    GPT is the sole planning/review brain. Cline/other coding models execute one approved task at a time,
    may propose implementation details, but must not silently change product rules, architecture, priorities,
    database contracts, security boundaries, or acceptance criteria.
  relationship_to_newerp: >-
    NEWERP is the PC ERP and NEWAPP is the mobile workspace of the same business platform.
    They share the same SQL Server database, the same OSS and the same master/business data.
    NEWAPP must not implement customer/supplier master-data synchronization copies.
  environment:
    env_file: 'D:\VSCodeProject\NEWAPP\.env'
    rules:
      - 'Read existing keys; never overwrite .env automatically.'
      - 'Never echo database passwords, OSS AccessKeySecret, tokens or full connection strings into logs/evidence.'
      - 'Server/worker may use DB and OSS secrets; mobile clients may not.'
      - 'If env key names differ from code defaults, add a ConfigMapping layer rather than renaming user secrets without approval.'
  target_clients:
    android_ios: Flutter
    harmonyos_next: ArkTS_ArkUI
  backend: ASP.NET_Core
  ai_service: Python
  database: SQL_Server_shared_with_NEWERP
  object_storage: OSS_shared_with_NEWERP
  api_contract: NEWAPP_OpenAPI_V1.yaml
  database_contract: NEWAPP_Database_DDL_V1.sql
  ui_contract: NEWAPP_UI页面原型与交互说明_V1.0.docx

automation:
  task_states: [queued, running, validating, review, completed, blocked, human_attention, deferred]
  required_artifacts_per_task:
    - implementation_diff
    - test_result
    - evidence_json
  ui_task_artifacts:
    - screenshot_or_screen_recording
    - layout_assertions
  gates:
    - name: secret_guard
      requirement: 'No .env secret value appears in git diff, logs, screenshots or evidence.'
    - name: architecture_guard
      requirement: 'No mobile client direct SQL connection and no long-lived OSS secret in mobile package.'
    - name: shared_data_guard
      requirement: 'Do not create duplicate Customer/Supplier master tables when NEWERP already owns them.'
    - name: migration_guard
      requirement: 'Any DB migration is idempotent/reviewable and does not destructively modify existing NEWERP tables without explicit approval.'
    - name: regression_guard
      requirement: 'Relevant backend, DB, client, sync and permission tests pass before task completion.'
    - name: gpt_review
      requirement: 'GPT compares evidence to task acceptance criteria before advancing the queue.'

phases:
  - id: P0
    name: Repository and discovery
  - id: P1
    name: Shared platform foundation
  - id: P2
    name: Authentication and bootstrap
  - id: P3
    name: Customer and supplier workspace
  - id: P4
    name: Inquiry core workflow
  - id: P5
    name: Camera, OSS and AI recognition
  - id: P6
    name: Batch capture and review
  - id: P7
    name: Excel export and records
  - id: P8
    name: Offline sync and conflict handling
  - id: P9
    name: Customization and admin control plane
  - id: P10
    name: GPT agent workspace
  - id: P11
    name: NEWERP seamless cross-terminal use
  - id: P12
    name: Release hardening

tasks:
  - id: NEWAPP-001
    phase: P0
    title: Freeze repository baseline and secret rules
    depends_on: []
    actions:
      - 'Initialize/inspect git repository without modifying .env.'
      - 'Add .env, local secrets, generated signing files and temporary exports to .gitignore.'
      - 'Add repository rules stating GPT brain/executor separation.'
    acceptance:
      - '.env remains present locally and untracked.'
      - 'Secret scanner on tracked files reports no credentials.'
  - id: NEWAPP-002
    phase: P0
    title: Inspect existing .env configuration contract safely
    depends_on: [NEWAPP-001]
    actions:
      - 'Read only key NAMES from .env; never print values.'
      - 'Classify keys as DB, OSS, auth provider, AI provider, app settings.'
      - 'Generate config binding map and missing-key report.'
    acceptance:
      - 'Evidence contains key names only, with all values redacted.'
      - 'No existing .env key is renamed or overwritten.'
  - id: NEWAPP-003
    phase: P0
    title: Inspect NEWERP shared database schema
    depends_on: [NEWAPP-002]
    actions:
      - 'Connect using server-side .env configuration.'
      - 'Read metadata only: schemas, tables, keys, indexes, rowversion columns and relevant customer/supplier/user/organization/dictionary/inquiry tables.'
      - 'Produce docs/NEWERP_SCHEMA_MAP.md with actual table/key mappings; redact data values.'
    acceptance:
      - 'Actual customer, supplier, user and tenant/company master tables are identified.'
      - 'No DDL/DML executed against production/shared DB.'
  - id: NEWAPP-004
    phase: P0
    title: Inspect shared OSS contract
    depends_on: [NEWAPP-002]
    actions:
      - 'Identify provider/endpoint/bucket/key-prefix configuration from env without logging secrets.'
      - 'Document NEWERP object-key conventions if discoverable from code/DB metadata.'
    acceptance:
      - 'Shared bucket/key-prefix strategy is documented.'
      - 'No secret is printed.'
  - id: NEWAPP-005
    phase: P0
    title: Reconcile DDL with actual NEWERP keys
    depends_on: [NEWAPP-003]
    actions:
      - 'Map neutral CustomerKey/SupplierKey/UserKey/TenantId to actual NEWERP key types.'
      - 'Prefer direct FK/view/repository mapping where safe; do not duplicate master tables.'
      - 'Create migration plan and rollback notes.'
    acceptance:
      - 'DDL compiles in a disposable copy/test DB.'
      - 'No destructive change to existing NEWERP tables.'
  - id: NEWAPP-006
    phase: P0
    title: Establish automated status console
    depends_on: [NEWAPP-001]
    actions:
      - 'Create start_agent.bat or equivalent status console showing git, current task, last validation and blockers.'
      - 'Keep GPT as decision/review authority.'
    acceptance:
      - 'Console starts from repository root and updates task status from machine-readable state.'

  - id: NEWAPP-007
    phase: P1
    title: Create backend solution skeleton
    depends_on: [NEWAPP-005]
    actions: ['Create ASP.NET Core API, Domain, Infrastructure, Worker, Tests projects.', 'Bind configuration from .env through typed options without logging secrets.']
    acceptance: ['Solution builds.', 'Health endpoint works locally.', 'Config validation fails with key NAMES only when required config is absent.']
  - id: NEWAPP-008
    phase: P1
    title: Create shared database repositories
    depends_on: [NEWAPP-007]
    actions: ['Implement repository interfaces for actual NEWERP master tables and app schema tables.', 'Inject tenant/user data scope server-side.']
    acceptance: ['Customer/supplier queries read existing shared master data.', 'No duplicate master repository writes to app-only copies.']
  - id: NEWAPP-009
    phase: P1
    title: Apply app schema migration in test database
    depends_on: [NEWAPP-005, NEWAPP-007]
    actions: ['Execute reconciled app schema DDL against disposable/test DB.', 'Verify re-run/idempotency.']
    acceptance: ['Migration succeeds twice without data loss.', 'Existing NEWERP objects remain unchanged except explicitly approved non-destructive indexes/FKs.']
  - id: NEWAPP-010
    phase: P1
    title: Implement shared OSS abstraction
    depends_on: [NEWAPP-004, NEWAPP-007]
    actions: ['Implement server-side OSS client from env.', 'Implement short-lived signed upload/download tickets.', 'Use shared object-key naming contract.']
    acceptance: ['Mobile can upload using signed ticket without receiving AccessKeySecret.', 'Uploaded object metadata appears in app.FileAsset.']
  - id: NEWAPP-011
    phase: P1
    title: Define OpenAPI generation and compatibility gate
    depends_on: [NEWAPP-007]
    actions: ['Serve generated OpenAPI.', 'Diff generated API against NEWAPP_OpenAPI_V1.yaml in CI.', 'Block breaking changes without version bump/ADR.']
    acceptance: ['CI detects removed endpoint or incompatible schema change.']
  - id: NEWAPP-012
    phase: P1
    title: Create Flutter app shell
    depends_on: [NEWAPP-011]
    actions: ['Create Android/iOS Flutter app.', 'Add routing, theme tokens, API client, local DB, secure token storage and diagnostics shell.']
    acceptance: ['Android and iOS debug builds succeed.', 'No DB/OSS secret exists in bundle/config.']
  - id: NEWAPP-013
    phase: P1
    title: Create HarmonyOS NEXT app shell
    depends_on: [NEWAPP-011]
    actions: ['Create ArkTS/ArkUI shell using same API and Design Tokens.', 'Generate/share API models from OpenAPI where practical.']
    acceptance: ['HarmonyOS app builds in DevEco environment.', 'Navigation parity with Flutter shell.']
  - id: NEWAPP-014
    phase: P1
    title: Add observability and correlation IDs
    depends_on: [NEWAPP-007]
    actions: ['Structured logs with correlation ID.', 'PII/secret redaction.', 'Request/AI/upload/export tracing.']
    acceptance: ['A failed request can be traced end-to-end without logging secrets.']

  - id: NEWAPP-015
    phase: P2
    title: Implement account-password login
    depends_on: [NEWAPP-008]
    actions: ['Integrate with shared NEWERP user identity or approved binding table.', 'Issue NEWAPP access tokens with tenant/group/role claims.']
    acceptance: ['Valid user logs in.', 'Disabled user cannot log in.', 'Token scope reflects current organization.']
  - id: NEWAPP-016
    phase: P2
    title: Implement SMS login and registration
    depends_on: [NEWAPP-015]
    actions: ['SMS send/verify flow.', 'Rate limiting.', 'Optional/required invite code rules.']
    acceptance: ['Replay/expired codes fail.', 'Invite usage is atomic.']
  - id: NEWAPP-017
    phase: P2
    title: Implement WeChat login
    depends_on: [NEWAPP-015]
    actions: ['OAuth exchange on server.', 'Bind provider subject to shared user.']
    acceptance: ['Provider token stays server-side.', 'Existing user binding is idempotent.']
  - id: NEWAPP-018
    phase: P2
    title: Implement Apple ID login
    depends_on: [NEWAPP-015]
    actions: ['Validate Apple identity token server-side.', 'Bind provider subject.']
    acceptance: ['Invalid issuer/audience/nonce rejected.', 'User binding idempotent.']
  - id: NEWAPP-019
    phase: P2
    title: Implement carrier one-tap phone login adapter
    depends_on: [NEWAPP-015]
    actions: ['Provider-agnostic adapter.', 'Server exchanges carrier token; mobile never trusts raw phone claim without server verification.']
    acceptance: ['Provider can be swapped by configuration.', 'Fallback to SMS available.']
  - id: NEWAPP-020
