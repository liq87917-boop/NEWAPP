    depends_on: [NEWAPP-020]
    actions: ['Text translation API abstraction.', 'Implement S25 with quotation/conversation context.']
    acceptance: ['Source/target language shown.', 'Failures do not block inquiry entry.']

  - id: NEWAPP-040
